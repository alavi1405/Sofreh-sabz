
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفره سبز | خرید و فروش غذاهای اضافه</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      background: #f0fdf4;
      color: #14532d;
      padding: 20px;
      line-height: 1.8;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white;
      border-radius: 16px;
      margin-bottom: 30px;
    }
    header h1 { font-size: 32px; margin-bottom: 10px; }
    header p { font-size: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #dcfce7;
    }
    .card h3 { color: #16a34a; margin-bottom: 8px; font-size: 18px; }
    .card p { color: #4b5563; font-size: 14px; }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 18px;
      background: #16a34a;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍲 سفره سبز</h1>
    <p>غذای اضافه‌ات را بفروش، غذای خوب را ارزان بخر</p>
  </header>
  <div class="grid">
    <div class="card">
      <h3>🍕 رستوران‌ها و فست‌فودها</h3>
      <p>غذاهای اضافه‌ی آخر شب را با تخفیف بفروش.</p>
      <a href="#" class="btn">مشاهده</a>
    </div>
    <div class="card">
      <h3>🍱 کترینگ‌ها</h3>
      <p>غذای مراسم و مهمانی‌های باقی‌مانده را عرضه کن.</p>
      <a href="#" class="btn">مشاهده</a>
    </div>
    <div class="card">
      <h3>🏠 غذاهای خانگی</h3>
      <p>آشپزهای خانگی، غذای دست‌سازشان را بفروشند.</p>
      <a href="#" class="btn">مشاهده</a>
    </div>
  </div>
</body>
  </html>
