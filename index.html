<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16a34a">
<title>سفره سبز | پلی برای استفاده بهینه از غذا</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:linear-gradient(180deg,#f0fdf4,#fff);background-attachment:fixed;color:#111827;padding:12px;line-height:1.8;min-height:100vh;padding-bottom:40px}

/* ═══════ هدر با لوگو ═══════ */
header{text-align:center;padding:22px 16px 18px;background:linear-gradient(135deg,#16a34a,#22c55e,#4ade80);color:#fff;border-radius:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(22,163,74,.15);position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%);pointer-events:none}
.logo-wrap{display:flex;justify-content:center;margin-bottom:10px;position:relative;z-index:1}
.logo-svg{width:110px;height:110px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}
header h1{font-size:24px;font-weight:800;margin-bottom:6px;position:relative;z-index:1;letter-spacing:.5px}
header .slogan{font-size:12.5px;opacity:.98;position:relative;z-index:1;font-weight:500;background:rgba(255,255,255,.15);display:inline-block;padding:4px 14px;border-radius:99px;backdrop-filter:blur(10px)}

/* ═══════ نوار جستجو ═══════ */
.search-wrap{background:#fff;border-radius:16px;padding:6px;box-shadow:0 2px 12px rgba(22,163,74,.08);margin-bottom:12px;display:flex;gap:6px;align-items:center;border:1.5px solid #dcfce7}
.search-wrap input{flex:1;padding:11px 14px;border:0;background:transparent;font:inherit;font-size:14px;color:#111827;outline:none}
.search-wrap input::placeholder{color:#9ca3af}
.search-wrap .search-icon{color:#16a34a;font-size:18px;padding:0 6px}
.search-wrap button{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:0;border-radius:12px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(22,163,74,.25)}

/* ═══════ حالت کاربر ═══════ */
.mode-switch{display:flex;background:#fff;border-radius:16px;padding:5px;margin-bottom:12px;box-shadow:0 2px 12px rgba(22,163,74,.08);gap:5px}
.mode-switch button{flex:1;padding:11px 8px;border:0;background:transparent;font:inherit;font-size:13px;border-radius:12px;cursor:pointer;color:#6b7280;font-weight:600;transition:all .25s}
.mode-switch button.active{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.3)}

/* ═══════ تب‌ها ═══════ */
nav.tabs{display:flex;background:#fff;border-radius:16px;padding:5px;margin-bottom:16px;box-shadow:0 2px 12px rgba(22,163,74,.08);gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1;min-width:85px;padding:10px 8px;border:0;background:transparent;font:inherit;font-size:12px;border-radius:11px;cursor:pointer;color:#6b7280;white-space:nowrap;transition:all .2s;font-weight:500}
nav.tabs button.active{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(22,163,74,.3)}

section.tab{display:none;animation:fadeIn .3s}
section.tab.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══════ جدول غذاها (سبک دیوار) ═══════ */
.food-table{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(22,163,74,.08);border:1px solid #dcfce7;margin-bottom:12px}
.food-row{display:grid;grid-template-columns:80px 1fr auto;gap:10px;padding:12px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .2s;align-items:center;text-decoration:none;color:inherit}
.food-row:last-child{border-bottom:0}
.food-row:active{background:#f0fdf4}
.food-thumb{width:80px;height:80px;border-radius:12px;background:linear-gradient(135deg,#dcfce7,#bbf7d0);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;position:relative;flex-shrink:0}
.food-thumb img{width:100%;height:100%;object-fit:cover}
.food-thumb .discount-tag{position:absolute;top:4px;right:4px;background:#dc2626;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px}
.food-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.food-title{font-weight:700;font-size:14px;color:#15803d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-meta{font-size:11px;color:#6b7280;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.food-meta .dot{color:#d1d5db}
.food-price{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.food-price .old{text-decoration:line-through;color:#9ca3af;font-size:11px}
.food-price .new{color:#16a34a;font-weight:800;font-size:14px;white-space:nowrap}
.food-price .stars-mini{color:#f59e0b;font-size:11px}

/* ═══════ کارت عمومی ═══════ */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(22,163,74,.08);border:1px solid #dcfce7}
.card h3{color:#15803d;font-size:15.5px;margin-bottom:6px;font-weight:700}
.card p{font-size:13px;color:#374151;margin-bottom:4px}

/* ═══════ قیمت در کارت ═══════ */
.price-row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.old-price{text-decoration:line-through;color:#9ca3af;font-size:12.5px}
.new-price{color:#16a34a;font-weight:800;font-size:17px}
.discount-badge{background:linear-gradient(135deg,#fef2f2,#fee2e2);color:#dc2626;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;border:1px solid #fecaca}

/* ═══════ چیپ ═══════ */
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:11.5px}
.chip{background:#f3f4f6;padding:4px 10px;border-radius:99px;color:#374151;font-weight:500;border:1px solid #e5e7eb}
.chip.green{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.chip.blue{background:#dbeafe;color:#0969da;border-color:#bfdbfe}
.chip.red{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.chip.orange{background:#ffedd5;color:#c2410c;border-color:#fed7aa}
.chip.gold{background:#fef3c7;color:#92400e;border-color:#fde68a}

/* ═══════ فرم ═══════ */
form label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:#374151}
form input,form select,form textarea{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font:inherit;font-size:14px;background:#f9fafb;transition:all .2s;color:#111827}
form input:focus,form select:focus,form textarea:focus{outline:none;border-color:#22c55e;background:#fff;box-shadow:0 0 0 4px rgba(34,197,94,.1)}

/* ═══════ دکمه‌ها ═══════ */
.btn{display:inline-block;padding:12px 20px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:0;border-radius:12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;width:100%;transition:all .2s;box-shadow:0 3px 10px rgba(22,163,74,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(22,163,74,.35)}
.btn.danger{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 3px 10px rgba(220,38,38,.25)}
.btn.blue{background:linear-gradient(135deg,#0969da,#3b82f6);box-shadow:0 3px 10px rgba(9,105,218,.25)}
.btn.gray{background:linear-gradient(135deg,#6b7280,#9ca3af)}
.btn.small{padding:8px 14px;font-size:12px;width:auto;margin-top:8px;display:inline-block}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ═══════ خالی ═══════ */
.empty{text-align:center;color:#9ca3af;font-size:13.5px;padding:40px 20px;line-height:2}
.empty-icon{font-size:48px;display:block;margin-bottom:10px;opacity:.5}

/* ═══════ توست ═══════ */
.toast{position:fixed;bottom:20px;right:20px;left:20px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;padding:14px 18px;border-radius:14px;font-size:13.5px;text-align:center;font-weight:600;opacity:0;transform:translateY(30px);transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:9999;box-shadow:0 8px 24px rgba(22,163,74,.35)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:linear-gradient(135deg,#dc2626,#ef4444)}

.required::after{content:" *";color:#dc2626}

/* ═══════ مودال ═══════ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex;animation:fadeIn .2s}
.modal{background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h3{color:#15803d;margin-bottom:14px;font-size:17px}

.stars{color:#f59e0b;font-size:15px;letter-spacing:1px}
#starPicker{display:flex;gap:10px;font-size:38px;color:#d1d5db;cursor:pointer;padding:8px 0;user-select:none}
#starPicker span{transition:all .15s}
#starPicker span.active{color:#f59e0b}

/* ═══════ فوتر ═══════ */
footer{text-align:center;padding:24px 12px 16px;font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:24px;line-height:2}
footer b{color:#16a34a}
footer a{color:#0969da;text-decoration:none}
footer .fingerprint{font-family:monospace;font-size:10px;color:#9ca3af;letter-spacing:1px;margin-top:6px;display:block}
</style>
</head>
<body>

<header>
<div class="logo-wrap">
<!-- ═══════════ لوگوی جدید: خونه با سقف رنگی + کاسه سوپ زیرش ═══════════ -->
<svg class="logo-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- سقف رنگی خانه (گرادیانت نارنجی-قرمز) -->
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- دود از لوله بخاری -->
  <path d="M 88 22 Q 92 18 88 14 Q 84 10 88 6" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 96 24 Q 100 20 96 16 Q 92 12 96 8" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- لوله بخاری -->
  <rect x="84" y="30" width="9" height="16" fill="#fff" rx="1.5"/>
  <rect x="82" y="28" width="13" height="5" fill="#fff" rx="2.5"/>

  <!-- سقف خانه (گرادیانت رنگی) -->
  <path d="M 15 70 L 60 34 L 105 70 Z" fill="url(#roofGrad)"/>
  <path d="M 15 70 L 60 34 L 105 70" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/>
  <!-- لبه‌های سقف روشن‌تر -->
  <path d="M 15 70 L 60 34 L 60 40 L 20 70 Z" fill="rgba(255,255,255,.25)"/>

  <!-- بدنه‌ی سفید خونه زیر سقف -->
  <rect x="30" y="70" width="60" height="14" fill="#fff" opacity=".9"/>

  <!-- کاسه سوپ پر (زیر سقف) -->
  <!-- سوپ داخل کاسه -->
  <ellipse cx="60" cy="82" rx="30" ry="6" fill="url(#soupGrad)"/>
  <!-- کاسه -->
  <path d="M 28 82 Q 60 104 92 82 Z" fill="url(#bowlGrad)"/>
  <path d="M 28 82 Q 60 104 92 82" stroke="rgba(22,163,74,.3)" stroke-width="1.5" fill="none"/>
  <!-- لبه کاسه -->
  <ellipse cx="60" cy="82" rx="32" ry="5" fill="none" stroke="#fff" stroke-width="2"/>
  <!-- تیکه‌های غذا داخل سوپ -->
  <circle cx="50" cy="81" r="2" fill="#dc2626" opacity=".7"/>
  <circle cx="65" cy="80" r="1.8" fill="#f59e0b" opacity=".8"/>
  <circle cx="72" cy="82" r="1.5" fill="#22c55e" opacity=".8"/>
  <circle cx="44" cy="82" r="1.5" fill="#a16207" opacity=".6"/>

  <!-- بخار از سوپ -->
  <path d="M 50 74 Q 53 70 50 66" stroke="rgba(255,255,255,.85)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 60 72 Q 63 68 60 64" stroke="rgba(255,255,255,.85)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 70 74 Q 73 70 70 66" stroke="rgba(255,255,255,.85)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
</div>
<h1>🍲 سفره سبز</h1>
<p class="slogan">پلی برای استفاده بهینه از غذا</p>
</header>

<!-- نوار جستجو -->
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" id="searchInput" placeholder="جستجوی غذا، فروشنده یا محل...">
  <button id="searchBtn">بگرد</button>
</div>

<!-- حالت کاربر -->
<div class="mode-switch">
<button id="modeCustomer" class="active" data-mode="customer">👤 مشتری</button>
<button id="modeSeller" data-mode="seller">🏪 فروشنده</button>
</div>

<!-- تب‌های مشتری -->
<nav class="tabs" id="tabsCustomer">
<button class="active" data-tab="foods">🍽️ غذاها</button>
<button data-tab="cart">🛒 سبد <span id="cartCount" style="background:#dc2626;color:white;padding:1px 7px;border-radius:99px;font-size:10px;margin-right:2px;display:none">0</span></button>
<button data-tab="myorders">📦 سفارش‌ها</button>
</nav>

<!-- تب‌های فروشنده -->
<nav class="tabs" id="tabsSeller" style="display:none">
<button class="active" data-tab="newlisting">➕ آگهی</button>
<button data-tab="newseller">🏪 فروشنده</button>
<button data-tab="sellerorders">📥 سفارش‌ها</button>
<button data-tab="mysellers">👥 فروشندگان</button>
</nav>

<!-- ============ تب‌ها ============ -->
<section id="tab-foods" class="tab active">
  <div id="foodsList"></div>
</section>

<section id="tab-cart" class="tab">
  <div id="cartList"></div>
  <div id="cartSummary"></div>
</section>

<section id="tab-myorders" class="tab">
  <div id="myOrdersList"></div>
</section>

<section id="tab-newlisting" class="tab">
<div class="card">
<h3>➕ ثبت آگهی غذا</h3>
<form id="listingForm">
<label class="required">نام غذا</label>
<input type="text" name="title" required placeholder="مثلاً: قیمه نثار">

<label class="required">فروشنده</label>
<select name="sellerId" id="sellerSelect" required><option value="">— انتخاب فروشنده —</option></select>

<label>لینک عکس غذا (اختیاری)</label>
<input type="url" name="image" placeholder="https://...">

<label>توضیحات</label>
<textarea name="description" rows="2" placeholder="مواد اولیه، وزن و..."></textarea>

<label class="required">قیمت اصلی (تومان)</label>
<input type="number" name="originalPrice" required min="0" placeholder="150000">

<label class="required">قیمت با تخفیف (تومان)</label>
<input type="number" name="discountedPrice" required min="0" placeholder="90000">

<label class="required">تعداد پرس موجود</label>
<input type="number" name="quantity" required min="1" value="1">

<label class="required">نوع تحویل</label>
<select name="deliveryType" required>
<option value="pickup">فقط حضوری</option>
<option value="courier_free">پیک رایگان</option>
<option value="courier_paid">پیک با هزینه</option>
<option value="both">هر دو</option>
</select>

<label>هزینه پیک (تومان)</label>
<input type="number" name="courierCost" min="0" value="0">

<label class="required">مدت آماده‌سازی</label>
<select name="deliveryTime" required>
<option value="15">۱۵ دقیقه</option>
<option value="30" selected>۳۰ دقیقه</option>
<option value="45">۴۵ دقیقه</option>
<option value="60">۱ ساعت</option>
<option value="120">۲ ساعت</option>
<option value="240">۴ ساعت</option>
</select>

<button type="submit" class="btn">ثبت آگهی ✅</button>
</form>
</div>
</section>

<section id="tab-newseller" class="tab">
<div class="card">
<h3>🏪 ثبت‌نام فروشنده</h3>
<form id="sellerForm">
<label class="required">نام کسب‌وکار / آشپز</label>
<input type="text" name="name" required placeholder="مثلاً: رستوران بهار">

<label class="required">نوع</label>
<select name="type" id="sellerType" required>
<option value="home">آشپز خانگی</option>
<option value="restaurant">رستوران</option>
<option value="fastfood">فست‌فود</option>
<option value="catering">کترینگ</option>
</select>

<label>شماره تماس</label>
<input type="tel" name="phone" placeholder="09121234567">

<label id="licenseLabel" class="required">شماره جواز کسب</label>
<input type="text" name="license" id="licenseInput" placeholder="مثلاً: ۱۲۳۴۵۶/ب">

<label class="required">محل ارائه (آدرس)</label>
<textarea name="address" id="addressInput" required rows="2" placeholder="مثلاً: تهران، ونک"></textarea>

<button type="button" class="btn blue" id="gpsBtn" style="width:auto;padding:8px 14px;font-size:12px;margin-top:6px">📍 موقعیت من</button>
<input type="hidden" name="lat" id="latInput">
<input type="hidden" name="lng" id="lngInput">
<p style="font-size:12px;color:#6b7280;margin-top:6px" id="gpsStatus"></p>

<button type="submit" class="btn">ثبت فروشنده ✅</button>
</form>
</div>
</section>

<section id="tab-sellerorders" class="tab"><div id="sellerOrdersList"></div></section>
<section id="tab-mysellers" class="tab"><div class="card"><h3>👥 فروشندگان ثبت‌شده</h3><div id="sellersList"></div></div></section>

<!-- مودال سفارش -->
<div class="modal-bg" id="orderModal"><div class="modal">
<h3>🛒 ثبت سفارش</h3>
<div id="orderFoodInfo"></div>
<form id="orderForm">
<label class="required">نام و نام خانوادگی</label>
<input type="text" name="customerName" required placeholder="مثلاً: علی رضایی">
<label class="required">شماره تماس</label>
<input type="tel" name="customerPhone" required placeholder="09121234567">
<label class="required">آدرس تحویل</label>
<textarea name="customerAddress" required rows="2"></textarea>
<label>توضیحات</label>
<textarea name="note" rows="2" placeholder="مثلاً: بدون پیاز"></textarea>
<button type="submit" class="btn">ثبت سفارش نهایی ✅</button>
<button type="button" class="btn danger" id="closeOrderModal">انصراف</button>
</form>
</div></div>

<!-- مودال ثبت نظر -->
<div class="modal-bg" id="reviewModal"><div class="modal">
<h3>💬 ثبت نظر و امتیاز</h3>
<div id="reviewFoodInfo"></div>
<form id="reviewForm">
<label class="required">نام شما</label>
<input type="text" name="customerName" required placeholder="مثلاً: علی رضایی">
<label class="required">امتیاز شما</label>
<div id="starPicker">
<span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
</div>
<input type="hidden" name="rating" id="ratingInput" required>
<label class="required">نظر شما</label>
<textarea name="text" required rows="3" placeholder="تجربه‌ات از این غذا چطور بود؟"></textarea>
<button type="submit" class="btn">ثبت نظر ✅</button>
